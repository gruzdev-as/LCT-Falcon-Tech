name: lct-falcon-tech

services:
  redis:
    image: redis:7.4.11-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-falcon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falcon}
      POSTGRES_DB: ${POSTGRES_DB:-falcon}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-falcon} -d ${POSTGRES_DB:-falcon}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # RustFS runs as uid 10001, so the bind-mounted directories must be owned by it before the server starts
  rustfs-permissions:
    image: alpine:3.21
    volumes:
      - ./data/rustfs:/data
    command: >
      sh -c "mkdir -p /data/rustfs0 /data/logs &&
             chown -R 10001:10001 /data &&
             echo 'rustfs volume permissions fixed'"
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /data/logs
    volumes:
      - ./data/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  init:
    build:
      context: .
      dockerfile: init/deploy/Dockerfile
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-falcon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falcon}
      POSTGRES_DB: ${POSTGRES_DB:-falcon}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-falcon-images}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INIT_GALLERY_DIR: /gallery
      INIT_WEIGHTS_DIR: /weights
      INIT_MODEL_URL: ${INIT_MODEL_URL:-}
      INIT_MODEL_SHA256: ${INIT_MODEL_SHA256:-}
      INIT_CATBOOST_URL: ${INIT_CATBOOST_URL:-}
      INIT_CATBOOST_SHA256: ${INIT_CATBOOST_SHA256:-}
      INIT_HF_TOKEN: ${INIT_HF_TOKEN:-}
      INIT_FORCE: ${INIT_FORCE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # The gallery is always mounted by whoever runs the stack: manifest.csv and images/
      - ${GALLERY_DIR:-./data/gallery}:/gallery:ro
      - ./data/weights:/weights
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Waits for the inference workers to embed the gallery init queued, logging progress.
  # The backend starts only once it exits 0, so nobody searches a half-built gallery.
  gallery-ready:
    build:
      context: .
      dockerfile: init/deploy/Dockerfile
    entrypoint: ["python", "-m", "init.app.wait"]
    restart: "no"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      INIT_WAIT_POLL_S: ${INIT_WAIT_POLL_S:-5}
      INIT_WAIT_STALL_S: ${INIT_WAIT_STALL_S:-300}
      INIT_WAIT_TIMEOUT_S: ${INIT_WAIT_TIMEOUT_S:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      init:
        condition: service_completed_successfully
      inference:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-falcon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falcon}
      POSTGRES_DB: ${POSTGRES_DB:-falcon}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-10}
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-falcon-images}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      gallery-ready:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stream worker: no ports, scales horizontally within one consumer group.
  # Liveness comes from the heartbeat HEALTHCHECK baked into the image.
  inference:
    build:
      context: .
      dockerfile: inference/deploy/Dockerfile
    deploy:
      replicas: ${INFERENCE_REPLICAS:-1}
    # Enough to finish the task in flight after SIGTERM
    stop_grace_period: 30s
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-falcon-images}
      INFERENCE_WEIGHTS_PATH: ${INFERENCE_WEIGHTS_PATH:-/weights/eva02.pt}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-auto}
      INFERENCE_COMPILE: ${INFERENCE_COMPILE:-false}
      INFERENCE_TORCH_THREADS: ${INFERENCE_TORCH_THREADS:-0}
      # Relative to /app: the preset ships in the image with the training submodule
      INFERENCE_REFUSAL_CONFIG: ${INFERENCE_REFUSAL_CONFIG:-training/configs/refusal/eva02_ensemble.yaml}
      INFERENCE_REFUSAL_MODEL_PATH: ${INFERENCE_REFUSAL_MODEL_PATH:-/weights/eva02_catboost.cbm}
      # Empty: the refusal preset decides. A value replaces it with a plain cosine threshold
      INFERENCE_REJECT_THRESHOLD: ${INFERENCE_REJECT_THRESHOLD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/weights:/weights:ro
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: deploy/Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
