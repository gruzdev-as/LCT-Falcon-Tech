# Serves the SPA and proxies the API from the same origin, so CORS never applies.
# Included from inside http{}, so it must contain a server{} block and nothing else.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1m, so without this any image over a megabyte dies here with
    # an HTML 413. Above the app's 20 MiB on purpose: an oversized upload should be
    # refused by the application, with its JSON message, not by the proxy.
    client_max_body_size    24m;
    client_body_buffer_size 1m;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy        no-referrer always;

    # With a literal host, nginx resolves `backend` once at startup and caches it for
    # the life of the process — a backend restart then 502s until nginx is reloaded.
    # Routing the lookup through Docker DNS needs the upstream to be a variable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer the upload before contacting uvicorn, so a slow client cannot hold an
        # async worker open for the length of its upload.
        proxy_request_buffering on;
        proxy_read_timeout      120s;
    }

    # The backend's probe, unversioned. The UI calls it after a poll timeout to tell
    # "API is down" from "no worker took the task". nginx's own probe is /healthz.
    location = /health {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # A cached index.html points at asset hashes that no longer exist after a
    # redeploy — a white screen. try_files below reaches this via internal redirect.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
