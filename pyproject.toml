[project]
name = "lct-falcon-tech"
version = "0.1.0"
description = "Visual vehicle re-identification: find every image of the same car by its appearance alone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev", "common", "backend"]

[dependency-groups]
common = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anyio>=4.6",
    "orjson>=3.10",
    "structlog>=24.4",
    "redis>=5.2",
    "qdrant-client>=1.12",
    "boto3>=1.35",
    "pillow>=11.0",
    "numpy>=2.1",
]

backend = [
    { include-group = "common" },
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
]

inference = [
    { include-group = "common" },
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0.11",
    "opencv-python-headless>=4.10",
]

training = [
    { include-group = "inference" },
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tqdm>=4.67",
    "albumentations>=1.4",
]

dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "anyio>=4.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["__pycache__", ".git", ".venv", "venv", ".pytype", "build", "dist", "training/notebooks"]
show-fixes = true

[tool.ruff.lint]
select = [
    "D",    # docstrings
    "E",    # PEP8 ошибки
    "F",    # flake8 — баги
    "B",    # flake8-bugbear — потенциальные баги
    "I",    # isort — чистые импорты
    "UP",   # modernize — современный синтаксис
    "S",    # security — безопасность
    "A",    # flake8-builtins — не перекрывать встроенные функции
    "ERA",  # eradicate — мёртвый код
    "SIM",  # simplify — упрощение кода
    "TRY",  # tryceratops — исключения
    "PERF", # perf — оптимизация
]

ignore = [
    "T201",   # print() в коде
    "D107",   # нет docstring в __init__
    "D100",   # нет docstring в модуле
    "D103",   # нет docstring в паблик функции
    "D104",   # нет docstring в public package
    "RUF002", # неоднозначный unicode-символ
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "D103", "D101"]  # assert и docstrings в тестах не нужны
"training/*" = ["D", "ERA", "S"]        # эксперименты живут по своим правилам
"backend/app/routers/*" = ["D301"]      # для опенапи

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# Top-level service packages, imported from the repo root.
known-first-party = ["backend", "common", "inference"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "inference/tests", "common/tests"]
asyncio_mode = "auto"
pythonpath = ["."]
